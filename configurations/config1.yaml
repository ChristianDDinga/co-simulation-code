InitializationSettings:
  config_id: 1  # Unique configuration id (plotted results will be saved with this id)
  time:
    start_time: 0  # Start time (minutes)
    end_time: 3000 # 44640  # End time (minutes, 31 days * 24 hours * 60 minutes)
    delta_t: 15  # Time step (minutes)
  passive_consumers_power_setpoints: data/combined_active_power.csv
  grid_topology: data/grid_topology.csv
  initial_conditions:
    heat_pump:
      power_set_point: 0 # Initial power setpoint [W]
    room:
      temperature: 20  # Initial temperature in the room.
      outside_temperature: 12   # Temperature outside the room.
      thermal_capacitance: 10000 # Represents how much heat is needed for a 1°C temperature increase.
      thermal_resistance: 0.05  # Represents how well the room is insulated (higher R = better insulation).
